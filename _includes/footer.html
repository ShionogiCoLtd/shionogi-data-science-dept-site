<!-- リンククリックの計測（GA4） -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const trackedLinks = document.querySelectorAll(
      'a[data-ga-label], a[target="_blank"], a.external-link, a[download]'
    );

    trackedLinks.forEach(function (link) {
      link.addEventListener('click', function () {
        if (typeof gtag !== 'function') {
          return;
        }

        const label = link.dataset.gaLabel || link.dataset.label || link.textContent.trim() || link.href;
        const locationName = link.dataset.gaLocation || 'site';
        const url = link.href;
        const isDownload = link.hasAttribute('download');
        const isPdf = /\.pdf(\?|#|$)/i.test(url);
        const isExternal = link.hostname && link.hostname !== window.location.hostname;

        let eventName = link.dataset.gaEvent;

        if (!eventName) {
          if (isDownload) {
            eventName = 'pdf_download';
          } else if (isPdf) {
            eventName = 'pdf_open';
          } else if (isExternal) {
            eventName = 'external_click_recruit';
          } else {
            eventName = 'site_link_click';
          }
        }

        gtag('event', eventName, {
          event_category: isExternal ? 'outbound' : 'internal',
          event_label: label,
          link_label: label,
          link_url: url,
          link_location: locationName
        });
      });
    });
  });
</script>
